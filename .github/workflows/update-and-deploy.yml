name: Mise à jour des données et publication

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions
  schedule:
    - cron: "17 4 * * 1" # chaque lundi à 04:17 UTC (prix, tailles, disponibilités)

permissions:
  contents: write # enregistrer les données mises à jour
  pages: write # publier sur GitHub Pages
  id-token: write # requis par deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      # Si le site de la marque est indisponible, on publie quand même avec les
      # données déjà présentes dans le dépôt (le script n'écrit qu'en fin de run).
      - name: Récupérer le catalogue Gong
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_catalog.py gong

      - name: Extraire les formes des boards depuis les photos
        id: outlines
        continue-on-error: true
        run: python3 scripts/extract_board_outlines.py gong

      - name: Signaler une récupération en échec
        if: steps.fetch.outcome == 'failure' || steps.outlines.outcome == 'failure'
        run: echo "::warning::Données non mises à jour (site de la marque indisponible ?). Publication avec les données existantes."

      - name: Tests
        run: npm test

      - name: Enregistrer les données mises à jour
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement de données."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git pull --rebase --quiet && git push
          fi

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html src data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
